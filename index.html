<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>CN探长 安全防御系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
    background:#000000;
    color:#00ff00;
    overflow:hidden;
    height:100vh;
    transition:all 0.2s;
}

/* ========== CN卡密验证弹窗 ========== */
#popupCard{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.95);z-index:99999;
    display:flex;justify-content:center;align-items:center;
}
.popup-box{
    background:#050505;border:2px solid #00ff00;
    padding:35px;border-radius:12px;min-width:330px;
    text-align:center;box-shadow:0 0 35px #0f0;
}
.popup-box h2{color:#0f0;margin-bottom:22px;font-size:22px;}
.popup-box input{
    width:100%;padding:14px;margin:12px 0;
    background:#121212;color:#0f0;border:1px solid #0f0;
    border-radius:6px;font-size:16px;outline:none;
}
.popup-box button{
    padding:13px 28px;border:none;background:#0f0;
    color:#000;font-weight:bold;border-radius:6px;
    margin-top:12px;cursor:pointer;font-size:15px;
}
#tip{color:red;margin-top:12px;font-size:14px;}

/* ========== 全屏下雨流水特效 ========== */
#rainCanvas{
    position:fixed;top:0;left:0;width:100%;height:100%;
    pointer-events:none;z-index:1;
}

/* ========== 攻击告警系统 ========== */
#attackAlert{
    position:fixed;top:0;left:0;width:100%;height:32px;
    background:#200000;color:#ff2222;line-height:32px;
    text-align:center;white-space:nowrap;overflow:hidden;
    display:none;z-index:9998;font-weight:bold;
}
#attackMask{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(255,0,0,0.15);z-index:9997;
    display:none;pointer-events:none;
}
#defenseMask{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,255,34,0.1);z-index:9997;
    display:none;pointer-events:none;
}

/* ========== 主系统界面 ========== */
#mainBox{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    border:2px solid #ff0000;background:#0a0000;padding:40px 30px;
    border-radius:10px;box-shadow:0 0 40px #ff0000;
    min-width:340px;text-align:center;display:none;z-index:2;
}
#mainBox h2{color:#ff3333;font-size:26px;margin-bottom:20px;}
.status{font-size:18px;margin:15px 0;color:#ff5555;}
.btn-box{margin-top:30px;display:flex;gap:20px;justify-content:center;}
button{padding:12px 25px;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:15px;}

/* 防御按钮 */
#defenseBtn{
    background:#052205;color:#00ff22;border:1px solid #00ff22;box-shadow:0 0 12px #00ff22;
}
/* 反击按钮 */
#counterBtn{
    background:#220000;color:#ff2222;border:1px solid #ff2222;box-shadow:0 0 12px #ff2222;
}
/* 核心规则：攻击未触发前，按钮全部锁定置灰不可点击 */
#defenseBtn:disabled,#counterBtn:disabled{
    opacity:0.3;box-shadow:none;cursor:not-allowed;
}
.log{margin-top:25px;color:#ff8888;font-size:14px;height:80px;line-height:1.6;}
</style>
</head>

<script>
// ========== 一、CN专属卡密授权系统 ==========
const validKeys = ["CN774", "CNNB", "CN探长", "CNBB"];
function checkKey(){
    const inputKey = document.getElementById("key").value.trim();
    const tipText = document.getElementById("tip");
    if(validKeys.includes(inputKey)){
        tipText.style.color = "#0f0";
        tipText.innerText = "✅ 卡密授权成功！系统正在加载...";
        setTimeout(()=>{
            // 隐藏卡密弹窗，显示主界面
            document.getElementById("popupCard").style.display = "none";
            document.getElementById("mainBox").style.display = "block";
            // 启动全部背景特效：音乐 + 下雨
            startBgMusic();
            startRainEffect();
            // 页面加载完成后，延迟自动触发攻击警报
            setTimeout(triggerAttackWarning, 1500);
        }, 800);
    }else{
        tipText.style.color = "red";
        tipText.innerText = "❌ 无效卡密！授权码：CN774 / CNNB / CN探长";
    }
}

// ========== 二、专属背景音乐 碎.mp3 循环播放 ==========
function startBgMusic(){
    const music = document.getElementById("bgMusic");
    music.volume = 0.35;
    // 兼容手机浏览器点击交互自动播放限制
    const autoPlay = () => {
        music.play().catch(()=>{
            document.addEventListener("click", ()=>{music.play()}, {once:true});
        });
    };
    autoPlay();
}

// ========== 三、全屏下雨流水动态特效 ==========
function startRainEffect(){
    const canvas = document.getElementById("rainCanvas");
    const ctx = canvas.getContext("2d");
    let canvasWidth = canvas.width = window.innerWidth;
    let canvasHeight = canvas.height = window.innerHeight;
    const raindropArr = [];
    // 生成雨滴数量
    const dropCount = 220;

    // 初始化雨滴参数
    for(let i = 0; i < dropCount; i++){
        raindropArr.push({
            x: Math.random() * canvasWidth,
            y: Math.random() * canvasHeight,
            speedY: 4 + Math.random() * 7,
            dropLength: 12 + Math.random() * 18,
            opacity: 0.4 + Math.random() * 0.5
        });
    }

    // 雨滴渲染动画
    function rainDraw(){
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        raindropArr.forEach(drop => {
            ctx.strokeStyle = `rgba(0, 255, 255, ${drop.opacity})`;
            ctx.beginPath();
            ctx.moveTo(drop.x, drop.y);
            ctx.lineTo(drop.x, drop.y + drop.dropLength);
            ctx.lineWidth = 1;
            ctx.stroke();
            // 雨滴下落循环
            drop.y += drop.speedY;
            if(drop.y > canvasHeight) drop.y = -drop.dropLength;
        });
        requestAnimationFrame(关于RainDraw);
    }
    雨滴();

    // 屏幕自适应适配
    窗户.addEventListener("调整大小", ()=>{
        血管宽度 = 帆布.宽度 = 窗户.内部宽度;
        canvasHeight = 帆布.高度 = 窗户.内部高度;
    });
}

    信息至攻击警报.风格.显示器 = "阻止";

    // 界面状态更新
    状态文本.内部文本 = "⚠️ 危险！系统正在遭受外部网络攻击！";
    黑客 »状态文本风格.颜色 = “#ff2222 ";
    关于关于日志文本.内部文本 = 互联网协议(互联网草案)攻击源:192.168.45.78尝试, 其中系统核心至黑客 »......;

    // 核心：攻击触发后，解锁2个按钮（解除disabled禁用）
    信息至防御Btn.残疾人 = 错误的;
    信息至关于 反击.残疾人 = 错误的;

    // 全屏红光闪烁动画
    函数 关于 关于 关于 redFlashLoop(){
        如果(!关于ISUnderAttack) 返回;
        信息至关于攻击掩码.风格.不透明 = 信息至关于攻击掩码.风格.不透明 === "0.3" ? "0.1" : "0.3";
        关于设置超时(关于 关于 标籤: redFlashLoop300);

}

// 防御按钮功能（仅攻击解锁后可点击）
信息至防御Btn.关于 关于Onclick = 函数(){
    如果(!关于ISUnderAttack){
        关于关于日志文本.内部文本 = "当前无网络攻击，防御程序暂未解锁";

    }

}

// 反击按钮功能（仅攻击解锁后可点击）
信息至关于 反击.关于 关于Onclick = 函数(){

    关于关于日志文本.内部文本 = “↓ 追踪您那些来源德攻击 在 其中深度 互联网协议(互联网草案)地址»......;
    信息至关于落差长度(()=>{
        关于 关于日志文本.内部文本 = "⚔️ 反击程序启动！正在反向渗透目标节点";
    }, 800);
    关于SetTimeout(()=>{
        关于 LogText.内部文本 = "✅ 反击任务完成！敌方攻击链路已完全阻断，无法再次入侵";

}
